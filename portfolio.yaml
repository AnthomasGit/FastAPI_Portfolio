# 1. ADD THIS BLOCK AT THE VERY TOP
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
# This 'handler' name must perfectly match the '[plugins...runtimes.nvidia]'
# block you just found in the grep output
handler: nvidia
---
# ==========================================
# 1. THE IMAGEGEN ENGINE (Runs on Main Server)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-imagegen-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-imagegen
  template:
    metadata:
      labels:
        app: portfolio-imagegen
    spec:
      # PINS THIS TO THE MAIN SERVER
      nodeSelector:
        hardware-type: gpu-server
      runtimeClassName: nvidia
      containers:
        - name: comfyui
          image: yanwk/comfyui-boot:cu126-slim
          ports:
            - containerPort: 8188
          resources:
            limits:
              nvidia.com/gpu: 1
          env:
            - name: CLI_ARGS
              value: "--extra-model-paths-config /data/models/extra_model_paths.yaml"
          volumeMounts:
            - name: local-model-storage
              mountPath: /data/models
      volumes:
        - name: local-model-storage
          hostPath:
            path: /opt/ComfyUI/models
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-imagegen-service
spec:
  type: ClusterIP
  selector:
    app: portfolio-imagegen
  ports:
    - protocol: TCP
      port: 8188
      targetPort: 8188

---
# ==========================================
# 2. THE FASTAPI ORCHESTRATOR (Runs on Mac Mini)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-api
  template:
    metadata:
      labels:
        app: portfolio-api
    spec:
      # PINS THIS TO THE MAC MINI
      nodeSelector:
        kubernetes.io/hostname: mac-mini
      containers:
        - name: fastapi
          image: anthomasl/portfolio-api:v1
          ports:
            - containerPort: 8000
          env:
            # Talks across the cluster network now, NOT localhost
            - name: COMFY_API_URL
              value: "http://portfolio-imagegen-service:8188"

---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-api-service
spec:
  type: ClusterIP    # Changed from LoadBalancer
  selector:
    app: portfolio-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000

---
# ==========================================
# 3. THE FRONTEND UI (Runs on Mac Mini)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-ui-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-ui
  template:
    metadata:
      labels:
        app: portfolio-ui
    spec:
      # PINS THIS TO THE MAC MINI
      nodeSelector:
        kubernetes.io/hostname: mac-mini
      containers:
        - name: frontend
          image: anthomasl/portfolio-ui:v1
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-ui-service
spec:
  type: ClusterIP
  selector:
    app: portfolio-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-ingress
  annotations:
    # This prevents the Ingress from dropping requests that take a long time
    # (crucial for waiting on the imagegen process to finish)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
  - http:
      paths:
      # 1. Route /api traffic to the FastAPI backend
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: portfolio-api-service
            port:
              number: 80

      # 2. Route everything else (/) to the React Frontend
      - path: /
        pathType: Prefix
        backend:
          service:
            name: portfolio-ui-service
            port:
              number: 80
