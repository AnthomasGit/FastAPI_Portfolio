apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-ai-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-ai-system
  template:
    metadata:
      labels:
        app: portfolio-api
    spec:
      containers:
        # ---------------------------------------------------
        # CONTAINER 1: The Orchestrator (FastAPI)
        # ---------------------------------------------------
        - name: fastapi
          image: anthomasl/portfolio-api:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            # Talks directly to the sidecar over the pod's shared localhost
            - name: COMFY_API_URL
              value: "http://127.0.0.1:8188"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

        # ---------------------------------------------------
        # CONTAINER 2: The Engine (ComfyUI)
        # ---------------------------------------------------
        - name: comfyui
          image: yanwk/comfyui-boot:latest
          ports:
            # Port 8188 is exposed locally to the Pod, but NOT to the K8s Service
            - containerPort: 8188
          resources:
            limits:
              # This requires the NVIDIA device plugin to be running on your K3s node
              nvidia.com/gpu: 1
          volumeMounts:
            - name: local-model-storage
              # This is where the yanwk image expects to find models
              mountPath: /opt/ComfyUI/models
              readOnly: true
            - name: local-output-storage
              mountPath: /opt/ComfyUI/output

        # ---------------------------------------------------
        # SHARED POD VOLUMES
        # ---------------------------------------------------

      volumes:
        - name: local-model-storage
          hostPath:
            path: /home/anthomas/ComfyUI/models # The path on your actual physical node
            type: Directory
        - name: local-output-storage
          hostPath:
            path: /home/anthomas/ComfyUI/output
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-api-service
spec:
  type: ClusterIP    # Changed from LoadBalancer
  selector:
    app: portfolio-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-ingress
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: portfolio-api-service
            port:
              number: 80
