services:
  # 1. The Orchestrator (FastAPI)
  portfolio-api:
    build: ./backend
    container_name: fastapi-orchestrator
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - COMFY_API_URL=http://comfyui:8188
      - DATABASE_URL=postgresql+asyncpg://portfolio_user:supersecretpassword@local-portfolio-db:5432/portfolio_db
      - OPTIMIZER_URL=http://optimizer:8300
      - BG_REMOVER_URL=http://bg-remover:8400
    volumes:
      - ./backend:/app
      - /opt/ComfyUI/input:/opt/ComfyUI/input
      - /opt/ComfyUI/output:/opt/ComfyUI/output
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      # Wait for migrations to finish before serving, so the app never runs
      # against a DB whose schema is behind the code (see the `migrate` service).
      migrate:
        condition: service_completed_successfully
      comfyui:
        condition: service_started
      optimizer:
        condition: service_started
      bg-remover:
        condition: service_started
      # Wait for the model to finish loading. Without this the first request
      # after `up` hits a server that is still mmap'ing weights and fails in a
      # way that looks like a timeout rather than a cold start.
      llama:
        condition: service_healthy

  # 1b. One-shot DB migrator. Runs `alembic upgrade head` to completion and
  #     exits; portfolio-api waits on its success. Uses the same image as the
  #     API (so it has alembic + alembic/env.py) and the same bind mount (so it
  #     sees the current migration files). A no-op when already up to date.
  migrate:
    build: ./backend
    container_name: portfolio-migrate
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://portfolio_user:supersecretpassword@local-portfolio-db:5432/portfolio_db
    volumes:
      - ./backend:/app
    command: alembic upgrade head
    restart: "no"
    depends_on:
      portfolio-db:
        condition: service_healthy

  # 2. The Database Layer (PostgreSQL)
  portfolio-db:
    image: postgres:15-alpine
    container_name: local-portfolio-db
    environment:
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: portfolio_db
    ports:
      - "5432:5432"
    volumes:
      - local_pg_data:/var/lib/postgresql/data
    healthcheck:
      # `migrate` waits on this — pg_isready confirms Postgres accepts
      # connections, not just that the container started.
      test: ["CMD-SHELL", "pg_isready -U portfolio_user -d portfolio_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  # 3. The Frontend UI (Vite Dev Server)
  portfolio-ui:
    image: node:24-alpine
    container_name: frontend-vite
    working_dir: /app
    # Maps to your sibling UI folder so hot-reloading works instantly
    volumes:
      - ./portfolio-ui:/app
      # Container-private node_modules: keeps Alpine/musl binaries and root-owned
      # files out of the host folder (host npm installs stay usable natively)
      - /app/node_modules
    # Installs packages (if missing) and starts Vite, exposing it to your host network
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - portfolio-api

  # 4. The Engine (ComfyUI Headless + Trellis2)
  comfyui:
    # Stock upstream image. ComfyUI-Trellis2 + its CUDA wheels/deps are
    # installed at boot by comfyui/pre-start.sh (sourced by the image's own
    # entrypoint) into named volumes below -- NOT baked into a custom image.
    # Bumping this tag is then just `docker compose pull && docker compose up -d`.
    # megapak-pt211 (not slim) specifically: ships flash-attn prebuilt and
    # Torch 2.11.0+cu130, an exact match for Trellis2's prebuilt wheels.
    image: yanwk/comfyui-boot:cu130-megapak-pt211
    container_name: comfyui-backend
    ports:
      - "8188:8188"
    environment:
      # Pass the exact same CLI args you use in K3s.
      # LTX-2.3 MSR now uses the GGUF Q5 transformer (~15.9GB) via GGUFLoaderKJ,
      # which stays fully resident on the 3090 with ~8GB left for activations --
      # so NO --lowvram (no per-step weight streaming = ~40x faster sampling)
      # and all other workflows keep full speed. For 1080x1920, render ~540x960
      # and use the LTX x2 spatial upscaler. See 3d-staging-lld-sdlc.md §11a.
      - CLI_ARGS=--extra-model-paths-config /data/models/extra_model_paths.yaml
      # expandable_segments reclaims fragmented CUDA segments -- harmless win,
      # keep it regardless (no speed cost, helps marginal loads).
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    volumes:
      # Map your server's global hostPath to the exact mountPath from K3s.
      # ORCHESTRATION NOTE: model weights are NOT bootstrapped by pre-start.sh --
      # this host path must be pre-seeded / backed by shared storage (NFS, etc.)
      # on every node a replica can schedule onto. The LTX-2.3 MSR clip workflow
      # specifically requires:
      #   checkpoints/ltx-2.3-22b-distilled-1.1.safetensors  (LTX-2.3 22B distilled)
      #   text_encoders/gemma_3_12B_it.safetensors           (Gemma-3 12B text encoder)
      - /opt/ComfyUI/models:/data/models
      # ComfyUI-Trellis2 resolves HF-style model dirs (facebook/dinov3-...,
      # microsoft/TRELLIS.2-4B, ...) via folder_paths.models_dir directly,
      # bypassing extra_model_paths.yaml's type remapping (which only covers
      # unet/clip/vae/checkpoints) — mount the same host folder at ComfyUI's
      # literal models dir too so those literal paths resolve.
      - /opt/ComfyUI/models:/root/ComfyUI/models
      - /opt/ComfyUI/output:/root/ComfyUI/output
      - /opt/ComfyUI/input:/root/ComfyUI/input
      # Boot-time installer, run by the base image's own entrypoint via
      # `source /root/user-scripts/pre-start.sh`. Must NOT be :ro -- the
      # entrypoint `chmod +x`'s this exact path before sourcing it, under its
      # own `set -e`; a read-only mount would make that chmod fail and abort
      # the whole container boot.
      - ./comfyui/pre-start.sh:/root/user-scripts/pre-start.sh
      # Torch version pins pre-start.sh passes to `pip install -c`. Never
      # chmod'd by the entrypoint, so read-only is safe here.
      - ./comfyui/torch-constraints.txt:/root/user-scripts/torch-constraints.txt:ro
      # Node source + wheels persist here across container recreation,
      # independent of /root/ComfyUI's core tree (which the base image's own
      # entrypoint refreshes from /default-comfyui-bundle on a missing
      # marker file -- we deliberately do NOT persist all of /root/ComfyUI,
      # so core ComfyUI + its bundled nodes always track the image tag).
      - comfyui_trellis2_node:/root/ComfyUI/custom_nodes/ComfyUI-Trellis2
      # Same rationale, for the Texture_Projection-Nodes node (multi-view
      # texture baking/projection, used by the mesh-texturing workflows).
      - comfyui_texture_projection_node:/root/ComfyUI/custom_nodes/Texture_Projection-Nodes
      # LTX-2.3 MSR clip-workflow node packs. Same clone-once rationale: each is
      # cloned by pre-start.sh at a PINNED commit SHA into its own volume, so a
      # fresh replica reproduces the exact working version (not a moving main),
      # and recreates don't re-clone. LTXVideo is NOT here -- it's bundled in the
      # image tag, so the tag pins it (only its kornia dep is pinned in
      # pre-start). To move a pack to a new SHA on an existing deployment,
      # pre-start's fetch+checkout enforces it on next boot automatically; no
      # volume wipe needed.
      - comfyui_licon_msr_node:/root/ComfyUI/custom_nodes/ComfyUI-Licon-MSR
      - comfyui_comfyroll_node:/root/ComfyUI/custom_nodes/ComfyUI_Comfyroll_CustomNodes
      - comfyui_promptrelay_node:/root/ComfyUI/custom_nodes/ComfyUI-PromptRelay
      # SCAIL-2 single/multi-reference character-animation node packs (same
      # pinned-SHA-on-named-volume rationale). Core Wan/SCAIL-2/WanAnimate nodes
      # are already native in the image's ComfyUI; these add the two packs'
      # multi-ref workflows. Missing deps (protobuf, pyloudnorm, mediapipe) go
      # into comfyui_pip_user via pre-start.
      - comfyui_wananimateplus_node:/root/ComfyUI/custom_nodes/ComfyUI-WanAnimatePlus
      - comfyui_customnodekit_node:/root/ComfyUI/custom_nodes/ComfyUI-CustomNodeKit
      # Krea2 2-pass T2I/I2I/inpaint workflow node packs (clone-once, same
      # pinned-SHA-on-named-volume rationale). All pure-Python, no extra deps.
      - comfyui_mxtoolkit_node:/root/ComfyUI/custom_nodes/comfyui-mxtoolkit
      - comfyui_krea2_negpip_node:/root/ComfyUI/custom_nodes/ComfyUI-krea2-negpip
      - comfyui_krea2t_enhancer_node:/root/ComfyUI/custom_nodes/ComfyUI-Krea2T-Enhancer
      # `pip install --user` target. Starts empty on every base image tag
      # (unlike mounting over /usr/local/lib64/python3.13/site-packages,
      # which would freeze the base image's OWN deps -- torch et al. -- at
      # whatever they were on first boot and silently defeat upgrades).
      - comfyui_pip_user:/root/.local
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [ gpu ]

  # 5. The Mesh Optimizer (headless Blender + gltf-transform, CPU-only)
  #    Post-processes generated GLBs into lightweight web proxies:
  #    decimate -> bake normals -> meshopt + WebP. Shares the ComfyUI output
  #    volume so it reads the raw mesh and writes *_web.glb where the API's
  #    mesh proxy already resolves paths. No GPU reservation needed.
  optimizer:
    build:
      context: .
      dockerfile: optimizer/Dockerfile
    container_name: mesh-optimizer
    environment:
      - COMFY_OUTPUT_DIR=/opt/ComfyUI/output
    volumes:
      - /opt/ComfyUI/output:/opt/ComfyUI/output
    ports:
      - "8300:8300"

  # 6. Background Removal (birefnet on CPU, no ComfyUI queue involved)
  #    Vendored copy of ComfyUI's own birefnet model code (see
  #    bg_remover/birefnet_model.py) running standalone -- a fast, direct
  #    local call from the API instead of a ComfyUI submit/poll round trip.
  #    Shares input+output volumes: reads reference images, writes the
  #    cleaned PNG back into COMFY_INPUT_DIR where LoadImage nodes expect it.
  bg-remover:
    build:
      context: .
      dockerfile: bg_remover/Dockerfile
    container_name: bg-remover
    environment:
      - COMFY_INPUT_DIR=/opt/ComfyUI/input
      - COMFY_OUTPUT_DIR=/opt/ComfyUI/output
    volumes:
      - /opt/ComfyUI/input:/opt/ComfyUI/input
      - /opt/ComfyUI/output:/opt/ComfyUI/output
      - /opt/ComfyUI/models/background_removal:/opt/ComfyUI/models/background_removal:ro
    ports:
      - "8400:8400"

  # 7. The LLM (llama.cpp server, OpenAI-compatible)
  #    Serves every LLM feature -- storyboard/shot-list/profile generation and
  #    the H3 clip prompts -- at /v1, so the app needs no code change: it is
  #    already a plain AsyncOpenAI client driven by OPENAI_BASE_URL/LLM_MODEL.
  #
  #    llama.cpp rather than Ollama for three reasons that matter here:
  #      * context is explicit (--ctx-size). Ollama silently defaults to 2048,
  #        which would truncate our screenplay prompts invisibly.
  #      * --override-tensor lets a 30B MoE run on 12GB by keeping attention on
  #        the GPU and routing expert tensors to RAM.
  #      * response_format={"type":"json_object"} is enforced with a GBNF
  #        grammar, so the sampler CANNOT emit invalid JSON. Every one of our
  #        seven call sites sends that field, and malformed/empty output was the
  #        exact failure that made hosted routing unusable.
  #
  #    Pinned to GPU 0 (RTX 3060, 12GB). ComfyUI holds GPU 1 (3090) below, so
  #    the two never contend -- video generation keeps the big card.
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-server
    ports:
      - "8080:8080"
    volumes:
      # Bind mount, not a named volume: GGUFs are 9-18GB and worth being able
      # to inspect, swap and delete from the host without docker plumbing.
      - ./models:/models
    # --parallel 1 because our callers are strictly serial (compose_for_scene
    # loops shots one at a time). llama-server defaults to 4 slots and sizes the
    # KV cache for all of them, which on a 12GB card left ~400MiB headroom --
    # an OOM waiting to happen mid-batch for concurrency we never use.
    #
    # Flags rather than LLAMA_ARG_* env vars, specifically so optional flags can
    # be OMITTED: llama-server rejects an empty value (e.g. an unset
    # --override-tensor is `invalid value`, not "ignore me"), and compose cannot
    # conditionally drop an environment entry. In a command string an empty
    # ${LLAMA_EXTRA_ARGS} simply expands to nothing.
    command: >
      --model /models/${LLAMA_GGUF}
      --ctx-size ${LLAMA_CTX:-16384}
      --n-gpu-layers ${LLAMA_NGL:-99}
      --alias ${LLM_MODEL}
      --parallel ${LLAMA_PARALLEL:-1}
      --host 0.0.0.0
      --port 8080
      ${LLAMA_EXTRA_ARGS:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [ gpu ]
    healthcheck:
      # /health reports 503 until the model is loaded, which is what gates
      # portfolio-api above. start_period is generous: a cold 14B load off
      # spinning-up page cache is slow, and A3B slower still.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      start_period: 300s
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  local_pg_data:
  comfyui_trellis2_node:
  comfyui_texture_projection_node:
  comfyui_licon_msr_node:
  comfyui_comfyroll_node:
  comfyui_promptrelay_node:
  comfyui_wananimateplus_node:
  comfyui_customnodekit_node:
  comfyui_mxtoolkit_node:
  comfyui_krea2_negpip_node:
  comfyui_krea2t_enhancer_node:
  comfyui_pip_user: